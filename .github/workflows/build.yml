name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: ./gradlew assembleDebug --no-daemon
        env:
          # Chave de teste do Gemini (opcional); sem ela, a chave é colada em Configurações
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk LegendaJP-build-${{ github.run_number }}.apk

      - name: Publicar APK em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: LegendaJP-build-${{ github.run_number }}.apk
          make_latest: true
